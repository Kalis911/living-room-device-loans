<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{% endblock %} - Device Loans</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Menu bar shown at the top of every page -->
  <nav>
    <strong>Living Room Device Loans</strong>
    {% if user %}
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('devices') }}">Devices</a>
      <a href="{{ url_for('users') }}">Users</a>
      <a href="{{ url_for('account') }}">My account</a>
      <span>Logged in as {{ user.name }} ({{ user.role }})</span>
      <!-- onsubmit asks "Are you sure?" before logging out -->
      <form action="{{ url_for('logout') }}" method="post"
            onsubmit="return confirm('Are you sure you want to log out?');">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>

  <main>
    <!-- Messages from flash() appear here: green for success, red for errors -->
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="message {{ category }}">{{ message }}</div>
    {% endfor %}

    <!-- Each page puts its own content here -->
    {% block content %}{% endblock %}
  </main>
</body>
</html>
